name: CI/CD Django

on:
  push:
    branches: [ main, cd-setup ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: django_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t django-cicd:latest .

      - name: Guardar imagen como archivo
        run: docker save django-cicd:latest -o django-cicd.tar

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: django-docker-image
          path: django-cicd.tar
          retention-days: 7

      # Simulación: NO se publica realmente en DockerHub
      - name: Simular push a DockerHub
        run: |
          echo "Simulando: docker tag django-cicd:latest usuario/django-cicd:latest"
          echo "Simulando: docker push usuario/django-cicd:latest"